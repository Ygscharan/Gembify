name: Build Gembify Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: gembify-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and ensure SDK 36
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Install frontend dependencies, build and sync Capacitor
        working-directory: frontend
        env:
          VITE_API_URL: https://gembify.onrender.com/api
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Read brief release summary
        id: meta
        run: |
          SUMMARY=$(node -e "const v = JSON.parse(require('fs').readFileSync('frontend/dist/version.json', 'utf8')); console.log(v.summary);")
          VERSION=$(node -e "const v = JSON.parse(require('fs').readFileSync('frontend/dist/version.json', 'utf8')); console.log(v.version);")
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: frontend/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Gembify.apk artifact
        run: |
          mkdir -p release-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-apk/Gembify.apk
          ls -lh release-apk/Gembify.apk

      - name: Publish Gembify.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Gembify Android App (${{ steps.meta.outputs.version }})"
          body: |
            **Novidades desta atualização:**
            ${{ steps.meta.outputs.summary }}

            Baixe e instale `Gembify.apk` no seu Android.
          files: release-apk/Gembify.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
